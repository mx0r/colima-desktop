# XcodeGen spec — the source of truth. ColimaDesktop.xcodeproj and App/Info.plist are generated:
#     xcodegen generate     (or: make gen)
name: ColimaDesktop
options:
  bundleIdPrefix: com.enscope.macos
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Release builds override both from the git tag and the CI run number.
    MARKETING_VERSION: "0.7.0-beta.3"
    CURRENT_PROJECT_VERSION: "1"
    # Public half of the Sparkle update signing key (README → Update signing key). Updates are
    # verified against it, so it must match the private key in the SPARKLE_ED_PRIVATE_KEY secret.
    SPARKLE_PUBLIC_ED_KEY: "Tc4alQPxRwOcggkfRvlRc4sjxy+NoGUFi09RCDgjT+Q="

packages:
  ColimaDesktopKit:
    path: Packages/ColimaDesktopKit

targets:
  ColimaDesktop:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
    dependencies:
      - package: ColimaDesktopKit
        product: ColimaAppShell
    info:
      path: App/Info.plist
      properties:
        # The bundle is ColimaDesktop.app (PRODUCT_NAME); everything a user reads — the About
        # panel, Login Items, notifications — comes from these.
        CFBundleName: Colima Desktop
        CFBundleDisplayName: Colima Desktop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # Menu bar app: no Dock icon until a window opens.
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Miro Hudak"
        # Sparkle: the cumulative feed (stable + beta entries) on the site, kept by the release
        # workflow. 0.6.x builds read releases/latest/download/appcast.xml, which stable releases
        # keep attaching.
        SUFeedURL: https://mx0r.github.io/colima-desktop/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        # Default for "Download and install updates automatically"; the user's choice overrides it.
        SUAutomaticallyUpdate: true
        # Read by SparkleUpdater: Debug builds do not update themselves (they would be offered the
        # published release, which shares their bundle ID and Sparkle settings).
        ColimaDesktopUpdates: $(COLIMA_DESKTOP_UPDATES)
    entitlements:
      path: App/ColimaDesktop.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enscope.macos.ColimaDesktop
        # No space: the name is load bearing in the Makefile, the release script and `pkill -x`.
        PRODUCT_NAME: ColimaDesktop
        PRODUCT_MODULE_NAME: ColimaDesktop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Off for local ad-hoc builds: library validation would refuse to load the embedded
        # Sparkle.framework. build-release.sh adds the hardened runtime when signing with a
        # Developer ID, which notarisation requires.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Ad-hoc signing: there is no Developer ID on the development machine.
        # scripts/build-release.sh re-signs with SIGN_IDENTITY when one is available.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          COLIMA_DESKTOP_UPDATES: "NO"
        Release:
          COLIMA_DESKTOP_UPDATES: "YES"

schemes:
  ColimaDesktop:
    build:
      targets:
        ColimaDesktop: all
    run:
      config: Debug
    archive:
      config: Release
