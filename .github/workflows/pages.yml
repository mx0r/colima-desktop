name: Pages

# Publishes site/ to https://mx0r.github.io/colima-desktop/.
#
# A workflow rather than the "deploy from a branch" setting, which can only serve the repo root or
# /docs — and /docs here holds the README's images and the project documentation, not a site.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates to Pages with an OIDC token rather than a secret.
  id-token: write

# One deployment at a time, and never cancel one midway: a half-published site is worse than a
# stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Uploaded as-is: one HTML file, one stylesheet, a few images, no scripts.
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
